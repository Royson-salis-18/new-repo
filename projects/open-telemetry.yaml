system:
  name: open-telemetry
  services: []
sources:
  prometheus:
    url: ''
    queries:
      cpu: sum(rate(container_cpu_usage_seconds_total{name=~".*{service}.*"}[1m]))
      memory: sum(container_memory_working_set_bytes{name=~".*{service}.*"})
      net_rx: sum(rate(container_network_receive_bytes_total{name=~".*{service}.*"}[1m]))
      net_tx: sum(rate(container_network_transmit_bytes_total{name=~".*{service}.*"}[1m]))
  jaeger:
    url: http://13.201.89.80:8080/jaeger/ui
    entry_services:
    - frontend-proxy
    slice_seconds: 120
    limit: 300
  loki:
    url: ''
    error_query: sum(count_over_time({service="{service}"} |~ "(?i)error|exception|fatal"
      [1m]))
collection:
  step_seconds: 15
  baseline_minutes: 10
detector:
  kind: calibrated
  z_threshold: 3.5
  alarm_budget_per_hour: 5
  persistence: 3
  calibration_windows: 100
  candidate_threshold: 3.5
cascade:
  max_lag_windows: 4
  max_hops: 3
experiment:
  runs: 10
  top_k:
  - 1
  - 3
  - 5
