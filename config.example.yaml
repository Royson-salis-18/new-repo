# rca-lab configuration. Run `python -m rcalab init` to be prompted for the
# required (REQUIRED) fields; `python -m rcalab check` lists what is missing.
# Telemetry is pulled from tool APIs only (no SSH).

system:
  name: REQUIRED            # label for this target, e.g. sock-shop
  # Service names to analyse. Leave empty to auto-discover from traces.
  services: []

sources:
  prometheus:
    url: REQUIRED           # e.g. http://<host>:9090
    # PromQL per metric; {service} is substituted. Defaults suit cAdvisor labels.
    queries:
      cpu: 'sum(rate(container_cpu_usage_seconds_total{name=~".*{service}.*"}[1m]))'
      memory: 'sum(container_memory_working_set_bytes{name=~".*{service}.*"})'
      net_rx: 'sum(rate(container_network_receive_bytes_total{name=~".*{service}.*"}[1m]))'
      net_tx: 'sum(rate(container_network_transmit_bytes_total{name=~".*{service}.*"}[1m]))'
  jaeger:
    url: REQUIRED           # e.g. http://<host>:16686   (traces + call graph)
  loki:
    url: ""                 # optional, e.g. http://<host>:3100 (logs)
    # LogQL; {service} is substituted. Counts error lines per window.
    error_query: 'sum(count_over_time({service="{service}"} |~ "(?i)error|exception|fatal" [1m]))'

collection:
  step_seconds: 15          # window size
  baseline_minutes: 10      # normal-behaviour period used to calibrate (unlabeled)

detector:
  kind: robust_z            # robust_z | isolation_forest
  z_threshold: 3.5

cascade:
  max_lag_windows: 4        # how far apart (in windows) a cause and effect may be
  max_hops: 3

fault_injection:
  # Commands run on THIS machine. {service} is substituted. Labels are written to
  # runs/<run_id>/label.json and used ONLY for scoring, never for training.
  faults:
    stop:   { inject: "docker stop {service}",  recover: "docker start {service}" }
    pause:  { inject: "docker pause {service}", recover: "docker unpause {service}" }
    cpu_throttle:
      inject:  "docker update --cpus 0.1 {service}"
      recover: "docker update --cpus 0 {service}"
  duration_seconds: 120
  settle_seconds: 60

experiment:
  runs: 10
  top_k: [1, 3, 5]
