<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rca-lab</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #111827; --panel-2: #0f1522; --line: #1f2937;
    --text: #e5e9f0; --muted: #8a94a7; --accent: #5ac8fa; --ok: #3b4a6b; --warn: #f5a524; --bad: #ff4d5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
         display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; padding: 10px 18px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  select, input[type=range] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
                              border-radius: 6px; padding: 4px 6px; font: inherit; }
  input[type=range] { padding: 0; width: 110px; accent-color: var(--accent); }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
           padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #04121c; border-color: var(--accent); font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 370px; min-height: 0; }
  #stage { position: relative; display: grid; grid-template-rows: 1fr 96px; min-height: 0; }
  #graphwrap { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #tip { position: absolute; pointer-events: none; background: #0b1220ee; border: 1px solid var(--line);
         padding: 6px 9px; border-radius: 6px; font-size: 12px; display: none; white-space: pre; }
  #legend { position: absolute; left: 14px; bottom: 10px; color: var(--muted); font-size: 12px; display: flex; gap: 14px; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 40px;
         color: var(--warn); background: var(--bg); }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px; }
  aside h2 { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .row { display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center; margin: 5px 0; font-size: 13px; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; transition: width .35s; }
  .num { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  #explain { white-space: pre-wrap; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
             padding: 10px 12px; color: #cfd6e4; font-size: 13px; }
  #timeline { border-top: 1px solid var(--line); background: var(--panel-2); }
  #modal { position: fixed; inset: 0; background: #000a; display: none; place-items: center; z-index: 5; }
  #modal > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px;
                 max-width: 860px; max-height: 85vh; overflow: auto; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 12px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13px; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  .tag { color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>rca<span>-lab</span></h1>
  <label>Source
    <select id="source"><option value="demo">Synthetic demo</option><option value="live">Live (config.yaml)</option></select></label>
  <label id="faultlbl">Fault in <select id="root"></select></label>
  <label>Method
    <select id="method"><option>full</option><option>no_cascade</option><option>no_precedence</option>
      <option>no_explained</option><option>pagerank</option><option>anomaly_only</option><option>earliest</option>
      <option>random</option></select></label>
  <label>Threshold <input id="z" type="range" min="2" max="8" step="0.5" value="3.5"><b id="zv">3.5</b></label>
  <label>Speed <select id="speed"><option value="1">1x</option><option value="2" selected>2x</option>
      <option value="4">4x</option><option value="8">8x</option></select></label>
  <button id="play" class="primary">Play</button>
  <button id="evalbtn">Evaluate</button>
  <span id="clock" class="tag"></span>
</header>

<main>
  <section id="stage">
    <div id="graphwrap">
      <canvas id="graph"></canvas>
      <div id="tip"></div>
      <div id="legend">
        <span><i style="background:#3b4a6b"></i>normal</span><span><i style="background:#f5a524"></i>deviating</span>
        <span><i style="background:#ff4d5a"></i>anomalous</span>
        <span>edge width = learned cascade probability</span><span>ring = cascade risk</span>
      </div>
      <div id="err"></div>
    </div>
    <div id="timeline"><canvas id="tl"></canvas></div>
  </section>
  <aside>
    <h2>Likely root causes</h2><div id="rank"></div>
    <h2>Cascade risk</h2><div id="risk"></div>
    <h2>Explanation</h2><div id="explain"></div>
  </aside>
</main>

<div id="modal"><div id="modalbody"></div></div>

<script>
const $ = id => document.getElementById(id);
const S = { t: -1, T: 0, data: null, playing: false, busy: false, nodes: new Map(), links: [], ready: false };

// ---------- colour ----------
const lerp = (a, b, k) => a + (b - a) * k;
function mix(c1, c2, k) { return c1.map((v, i) => Math.round(lerp(v, c2[i], k))); }
const C_OK = [59, 74, 107], C_WARN = [245, 165, 36], C_BAD = [255, 77, 90];
function zColor(z, thr) {
  const k = Math.min(Math.max(z / thr, 0), 2);
  const rgb = k < 1 ? mix(C_OK, C_WARN, k) : mix(C_WARN, C_BAD, k - 1);
  return `rgb(${rgb.join(",")})`;
}

// ---------- data ----------
function params() {
  return new URLSearchParams({ source: $("source").value, root: $("root").value, method: $("method").value,
                               z: $("z").value, hard: true, t: S.t, minutes: 30 });
}
async function load() {
  if (S.busy) return; S.busy = true;
  try {
    const d = await (await fetch("/api/state?" + params())).json();
    if (d.error) { showError(d.error); return; }
    $("err").style.display = "none";
    S.data = d; S.T = d.T; S.t = d.t; apply(d);
  } catch (e) { showError(String(e)); } finally { S.busy = false; }
}
function showError(msg) { const e = $("err"); e.textContent = msg; e.style.display = "grid"; S.playing = false; $("play").textContent = "Play"; }

// ---------- graph ----------
const canvas = $("graph"), ctx = canvas.getContext("2d");
let W = 0, H = 0;
function resize() {
  const r = $("graphwrap").getBoundingClientRect(), dpr = devicePixelRatio || 1;
  W = r.width; H = r.height; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t = $("tl").getBoundingClientRect(); $("tl").width = t.width * dpr; $("tl").height = t.height * dpr;
  if (S.ready) layout();
  if (S.data) drawTimeline();
}
const depth = {}, layers = {};
function computeDepth(edges) {            // call depth: edges run callee -> caller, so callers are shallow
  const callers = {}; edges.forEach(e => (callers[e.source] ||= []).push(e.target));
  const memo = {}; const d = id => memo[id] ??= 1 + Math.max(-1, ...(callers[id] || []).map(d));
  [...new Set(edges.flatMap(e => [e.source, e.target]))].forEach(id => depth[id] = d(id));
}
function layout() {                       // deterministic layered layout: callers left, dependencies right
  const maxD = Math.max(1, ...Object.values(depth));
  const byLayer = {}; S.nodes.forEach(n => (byLayer[depth[n.id] ?? 0] ||= []).push(n));
  Object.entries(byLayer).forEach(([dep, ns]) => {
    ns.sort((a, b) => a.id.localeCompare(b.id));
    ns.forEach((n, i) => { n.tx = 90 + (W - 180) * (+dep / maxD); n.ty = 45 + (H - 120) * (i + .5) / ns.length + 15; });
  });
}
function apply(d) {
  if (!S.ready) initGraph(d);
  d.nodes.forEach(n => {
    const o = S.nodes.get(n.id);
    Object.assign(o, { tz: n.z, trisk: n.risk, flag: n.flag, score: n.score });
  });
  const key = e => e.source + ">" + e.target;
  const old = new Map(S.links.map(l => [key(l.raw), l]));
  S.links = d.edges.map(e => { const l = old.get(key(e)) || { s: S.nodes.get(e.source), t: S.nodes.get(e.target), w: 0 };
                              l.raw = e; l.tw = e.p; l.hot = e.hot; return l; });
  renderPanel(d); drawTimeline();
  $("clock").textContent = `window ${d.t + 1}/${d.T}  ·  ${new Date(d.time * 1000).toLocaleTimeString()}`
    + (d.t <= d.baseline ? "  ·  baseline" : "");
}
function initGraph(d) {
  computeDepth(d.edges);
  d.nodes.forEach(n => S.nodes.set(n.id, { id: n.id, x: W / 2, y: H / 2, tx: W / 2, ty: H / 2, z: 0, tz: 0, risk: 0, trisk: 0, score: 0, flag: false }));
  layout(); S.nodes.forEach(n => { n.x = n.tx; n.y = n.ty; }); S.ready = true;
}
function radius(n) { return 15 + n.risk * 14; }
function edgePoint(a, b, r) { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1; return [a.x + dx / L * r, a.y + dy / L * r]; }

function draw(ts) {
  requestAnimationFrame(draw);
  ctx.clearRect(0, 0, W, H);
  if (!S.data) return;
  const thr = S.data.z_threshold, top = S.data.ranking[0]?.service;
  S.nodes.forEach(n => { n.z = lerp(n.z, n.tz, .15); n.risk = lerp(n.risk, n.trisk, .15);
    if (!n.pinned) { n.x = lerp(n.x, n.tx, .2); n.y = lerp(n.y, n.ty, .2); } });

  for (const l of S.links) {                       // edges
    l.w = lerp(l.w, l.tw, .12);
    const a = l.s, b = l.t; if (!a || !b) continue;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, nx = -(b.y - a.y), ny = b.x - a.x, L = Math.hypot(nx, ny) || 1;
    const cx = mx + nx / L * 22, cy = my + ny / L * 22;
    const [x0, y0] = edgePoint(a, { x: cx, y: cy }, radius(a)), [x1, y1] = edgePoint(b, { x: cx, y: cy }, radius(b) + 4);
    ctx.lineWidth = 1 + l.w * 7; ctx.strokeStyle = l.hot ? "rgba(255,77,90,.85)" : "rgba(138,148,167,.35)";
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
    const ang = Math.atan2(y1 - cy, x1 - cx);       // arrow head
    ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - 9 * Math.cos(ang - .4), y1 - 9 * Math.sin(ang - .4));
    ctx.lineTo(x1 - 9 * Math.cos(ang + .4), y1 - 9 * Math.sin(ang + .4)); ctx.fill();
    if (l.hot) {                                    // particles: failure flowing callee -> caller
      for (let i = 0; i < 3; i++) {
        const u = ((ts / 900) + i / 3) % 1, q = 1 - u;
        const px = q * q * x0 + 2 * q * u * cx + u * u * x1, py = q * q * y0 + 2 * q * u * cy + u * u * y1;
        ctx.fillStyle = "#ffd2d6"; ctx.beginPath(); ctx.arc(px, py, 2.4, 0, 7); ctx.fill();
      }
    }
    ctx.fillStyle = "#aab3c5"; ctx.font = "11px system-ui"; ctx.textAlign = "center";
    ctx.fillText(l.tw.toFixed(2), cx, cy - 4);
  }
  S.nodes.forEach(n => {                            // nodes
    const r = radius(n), col = zColor(n.z, thr);
    ctx.shadowColor = col; ctx.shadowBlur = n.z > thr * .6 ? 18 : 0;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.lineWidth = 1 + n.risk * 6; ctx.strokeStyle = `rgba(90,200,250,${.25 + n.risk * .75})`;
    ctx.beginPath(); ctx.arc(n.x, n.y, r + 3 + n.risk * 3, 0, 7); ctx.stroke();
    if (n.id === top) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 11, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#e5e9f0"; ctx.font = "12px system-ui"; ctx.textAlign = "center"; ctx.fillText(n.id, n.x, n.y + r + 22);
  });
}

// drag + hover
let drag = null;
const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
const hit = (x, y) => [...S.nodes.values()].find(n => Math.hypot(n.x - x, n.y - y) < radius(n) + 6);
canvas.addEventListener("mousedown", e => { const n = hit(...pos(e)); if (n) { drag = n; n.pinned = true; } });
addEventListener("mouseup", () => { drag = null; });
canvas.addEventListener("dblclick", () => { S.nodes.forEach(n => n.pinned = false); });   // double-click resets layout
canvas.addEventListener("mousemove", e => {
  const [x, y] = pos(e);
  if (drag) { drag.x = x; drag.y = y; }
  const n = hit(x, y), tip = $("tip");
  if (n) { tip.style.display = "block"; tip.style.left = x + 14 + "px"; tip.style.top = y + 14 + "px";
    tip.textContent = `${n.id}\ndeviation z = ${n.tz.toFixed(1)}\ncascade risk = ${(n.trisk * 100).toFixed(0)}%\nroot-cause score = ${n.score.toFixed(2)}`; }
  else tip.style.display = "none";
});

// ---------- side panel ----------
function renderBars(el, rows, color) {
  el.innerHTML = rows.map(r => `<div class="row"><span>${r.name}</span><div class="bar"><div style="width:${Math.min(r.v, 1) * 100}%;background:${color}"></div></div><span class="num">${r.v.toFixed(2)}</span></div>`).join("")
    || '<span class="tag">nothing yet</span>';
}
function renderPanel(d) {
  const max = Math.max(...d.ranking.map(r => r.score), 1e-9);
  renderBars($("rank"), d.ranking.slice(0, 6).map(r => ({ name: r.service, v: r.score / max })), "var(--bad)");
  renderBars($("risk"), [...d.nodes].sort((a, b) => b.risk - a.risk).slice(0, 6).map(n => ({ name: n.id, v: n.risk })), "var(--accent)");
  $("explain").textContent = d.explanation;
}

// ---------- timeline ----------
const tl = $("tl"), tctx = tl.getContext("2d");
function drawTimeline() {
  const d = S.data; if (!d) return;
  const dpr = devicePixelRatio || 1, w = tl.width / dpr, h = tl.height / dpr;
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0); tctx.clearRect(0, 0, w, h);
  const X = i => 12 + (w - 24) * i / Math.max(d.T - 1, 1), Y = v => h - 10 - (h - 24) * Math.min(v, 14) / 14;
  tctx.fillStyle = "#151d2e"; tctx.fillRect(X(0), 0, X(d.baseline) - X(0), h);       // baseline shading
  tctx.fillStyle = "#8a94a7"; tctx.font = "11px system-ui"; tctx.fillText("baseline", X(0) + 4, 13);
  tctx.strokeStyle = "rgba(255,77,90,.5)"; tctx.setLineDash([3, 3]);                  // threshold
  tctx.beginPath(); tctx.moveTo(12, Y(d.z_threshold)); tctx.lineTo(w - 12, Y(d.z_threshold)); tctx.stroke(); tctx.setLineDash([]);
  tctx.beginPath(); d.series.forEach((v, i) => i ? tctx.lineTo(X(i), Y(v)) : tctx.moveTo(X(i), Y(v)));
  tctx.strokeStyle = "#5ac8fa"; tctx.lineWidth = 1.5; tctx.stroke();
  if (d.onset != null) { tctx.fillStyle = "#f5a524"; tctx.fillText("injected", X(d.onset) + 4, 13);
    tctx.fillRect(X(d.onset), 18, 1.5, h - 18); }
  tctx.fillStyle = "#fff"; tctx.fillRect(X(d.t) - 1, 0, 2, h);                         // playhead
}
function scrub(e) { const r = tl.getBoundingClientRect(), f = (e.clientX - r.left - 12) / (r.width - 24);
  S.t = Math.round(Math.min(Math.max(f, 0), 1) * (S.T - 1)); load(); }
let scrubbing = false;
tl.addEventListener("mousedown", e => { scrubbing = true; scrub(e); });
addEventListener("mousemove", e => { if (scrubbing) scrub(e); });
addEventListener("mouseup", () => scrubbing = false);

// ---------- playback ----------
let timer = null;
function setPlaying(on) {
  S.playing = on; $("play").textContent = on ? "Pause" : "Play"; clearInterval(timer);
  if (!on) return;
  if ($("source").value === "demo" && S.t >= S.T - 1) S.t = -2;     // restart from the beginning
  timer = setInterval(() => {
    if ($("source").value === "demo") { S.t = S.t + 1 >= S.T ? 0 : S.t + 1; if (S.t < 0) S.t = 0; }
    else S.t = -1;                                                  // live: follow the latest window
    load();
  }, $("source").value === "demo" ? 450 / $("speed").value : 5000);
}
$("play").onclick = () => setPlaying(!S.playing);
$("speed").onchange = () => S.playing && setPlaying(true);
["root", "method"].forEach(id => $(id).onchange = () => { load(); });
$("z").oninput = () => { $("zv").textContent = $("z").value; };
$("z").onchange = load;
$("source").onchange = () => { $("faultlbl").style.display = $("source").value === "demo" ? "" : "none";
  S.t = -1; S.nodes.clear(); S.ready = false; S.links = []; setPlaying(false); load(); };

// ---------- evaluation modal ----------
$("evalbtn").onclick = async () => {
  $("modal").style.display = "grid"; $("modalbody").innerHTML = "Running evaluation…";
  const r = await (await fetch("/api/eval?source=" + $("source").value)).json();
  const f = (m, k) => `${(m[k].mean).toFixed(2)} <span class="tag">[${m[k].ci95[0].toFixed(2)}, ${m[k].ci95[1].toFixed(2)}]</span>`;
  const rows = Object.entries(r.metrics).map(([name, m]) => { const c = r.proposed_vs_others[name];
    return `<tr><td>${name}</td><td>${f(m, "A@1")}</td><td>${f(m, "A@3")}</td><td>${f(m, "MRR")}</td>
      <td>${c ? c.p_holm.toFixed(3) : "—"}</td><td>${c ? c.cliffs_delta.toFixed(2) : "—"}</td></tr>`; }).join("");
  $("modalbody").innerHTML = `<h3 style="margin-top:0">${r.n_runs} runs · ${$("source").value === "demo" ? "synthetic sanity check (not evidence)" : "live fault-injection runs"}</h3>
    <table><tr><th>method</th><th>A@1 [95% CI]</th><th>A@3</th><th>MRR</th><th>p (Holm) vs full</th><th>Cliff's δ</th></tr>${rows}</table>
    <p class="tag">Saved from the CLI: <code>python -m rcalab evaluate</code> → results/&lt;run&gt;/ (summary.json, per_run.csv, table.tex)</p>
    <button onclick="document.getElementById('modal').style.display='none'">Close</button>`;
};
$("modal").onclick = e => { if (e.target.id === "modal") $("modal").style.display = "none"; };

// ---------- boot ----------
(async () => {
  const m = await (await fetch("/api/meta")).json();
  $("root").innerHTML = m.demo_services.map(s => `<option ${s === "cart-db" ? "selected" : ""}>${s}</option>`).join("");
  $("z").value = m.z; $("zv").textContent = m.z;
  addEventListener("resize", resize); resize(); requestAnimationFrame(draw);
  await load();
})();
</script>
</body>
</html>
